<nav class="mobile-navigation" aria-label="Main navigation">
  <details>
    <summary>Menu</summary>
    <ul class="mobile-navigation__links">
      {{ range $.Site.Menus.main }}
        {{ if not .HasChildren }}
          {{ $active := or (strings.HasPrefix $.RelPermalink .URL) (and $.IsHome (eq .Identifier "signals")) }}
          <li><a href="{{ .URL }}" {{ if $active }}aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      {{ end }}
    </ul>
  </details>
</nav>
